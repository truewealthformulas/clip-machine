# 3 ORIGINAL carousels a day on Instagram AND the Facebook Page (18 Nov) (agents/carousel.py), 18 Nov 2026:
# Account Status said "Contenido no original", so the Kevin reels are paused on
# Instagram for 30 days (engine/poster.py IG_REELS_PAUSE_UNTIL) and these take
# their place. Times are New York: 9:00, 13:00, 19:30.
name: carousel
on:
  workflow_dispatch:
    inputs:
      dry:
        description: "Make the slides only, post nothing"
        type: boolean
        default: false
  schedule:
    - cron: "0 14 * * *"
    - cron: "0 18 * * *"
    - cron: "30 0 * * *"
concurrency:
  group: post
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  carousel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      IG_USER_ID: ${{ secrets.IG_USER_ID }}
      IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -q pillow requests anthropic
      - name: Make and post one carousel
        run: python agents/carousel.py ${{ inputs.dry && '--dry' || '' }}
      - name: Upload the slides (to look at)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: carousel-slides
          path: /tmp/carousel
          if-no-files-found: ignore
      - name: Remember it
        if: ${{ !inputs.dry }}
        run: |
          git config user.name "kt-machine"
          git config user.email "noreply@github.com"
          git add state/carousels.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -q -m "carousel: $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
