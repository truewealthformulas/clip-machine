# The Success Club look (style C): big hook bar, gold rule, club name, gold progress bar.
# Applied to every queued clip that doesn't have it yet - after each factory run, and
# every 6 hours as a safety net. Same lock as `post`, so a clip is never swapped
# while it is being published.
name: restyle
on:
  workflow_dispatch:
  workflow_run:
    workflows: [factory]
    types: [completed]
  schedule:
    - cron: "15 */6 * * *"
permissions:
  contents: write
concurrency:
  group: post
  cancel-in-progress: false
jobs:
  restyle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q numpy pillow opencv-python-headless
      - name: Apply the club look
        run: python factory/restyle.py
      - name: Save
        if: always()
        run: |
          git config user.name "clip-agents"
          git config user.email "clip-agents@users.noreply.github.com"
          git add state/manifest.json
          git diff --staged --quiet && exit 0
          git commit -q -m "restyle: club look $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
