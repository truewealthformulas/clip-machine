<meta charset=utf-8><meta name=viewport content='width=device-width,initial-scale=1'><title>Captions</title>
<style>body{font:15px/1.5 -apple-system,system-ui,sans-serif;margin:0;padding:16px;background:#0d0f13;color:#e8e8ea}h1{font-size:18px;margin:0 0 4px}h2{font-size:13px;letter-spacing:.09em;color:#8b93a5;margin:22px 0 10px}.c{border:1px solid #262a33;border-radius:12px;padding:14px;margin:0 0 14px;background:#141821}.c.ready{border-color:#f5c542}.w{font-size:11px;letter-spacing:.08em;color:#8b93a5}.fn{font-size:12px;color:#8b93a5;margin:2px 0 0;word-break:break-all}.hd{display:flex;gap:11px;align-items:flex-start;margin:0 0 10px}.th{width:54px;min-width:54px;aspect-ratio:9/16;object-fit:cover;border-radius:7px;background:#1d2230;display:block}.meta{min-width:0}pre{white-space:pre-wrap;margin:0;font:14px/1.55 inherit}button{margin-top:10px;padding:9px 16px;border-radius:8px;border:0;background:#f5c542;color:#111;font-weight:700}button.pick{background:#242a36;color:#e8e8ea;margin:2px 6px 12px 0;font-weight:600}button.pick.on{background:#f5c542;color:#111}#more{display:none}</style>
<h1>Captions</h1>
<div><button class='pick on' onclick="pick('all',this)">All</button><button class='pick' onclick="pick('OWNER',this)">the owner</button><button class='pick' onclick="pick('AR',this)">Brand 2</button></div>
<h2>READY TO POST ON TIKTOK &middot; 0</h2>
<div class=c>Nothing waiting.</div>
<button class='pick' onclick="document.getElementById('more').style.display='block';this.remove()">See all 0</button>
<div id=more>
</div>
<script>function pick(w,b){document.querySelectorAll('button.pick').forEach(x=>x.classList.remove('on'));b.classList.add('on');document.querySelectorAll('.c').forEach(e=>{e.hidden=w!=='all'&&e.dataset.who!==w;});}function cp(id,b){navigator.clipboard.writeText(document.getElementById(id).innerText);const c=b.closest('.c');c.style.transition='opacity .25s';c.style.opacity=0;setTimeout(()=>c.remove(),260);try{const d=JSON.parse(localStorage.done||'[]');d.push(id);localStorage.done=JSON.stringify(d);}catch(e){}}try{JSON.parse(localStorage.done||'[]').forEach(id=>{const el=document.getElementById(id);if(el)el.closest('.c').remove();});}catch(e){}</script>
